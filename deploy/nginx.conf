# RuntimeShield web console front-end.
#
# Serves the static console build and reverse-proxies the API to the
# control plane service. The console's API base is /v1 (web/src/lib/api.ts:
# `const BASE = "/v1"`), so /v1/ is the API prefix — NOT /api/. The control
# plane (Go, cmd/controlplane/main.go + internal/api/server.go) mounts its
# routes under /v1/: /v1/healthz, /v1/devices/..., /v1/events/batch,
# /v1/approvals/..., /v1/workspaces/..., /v1/policies, /v1/organizations,
# /v1/devices.
#
# This file is copied to /etc/nginx/conf.d/default.conf by web/Dockerfile
# (product-level `server` block, not the mainline conf). The control plane
# is reached by nginx service name `controlplane` — a compose DNS alias,
# resolved only when the two containers share a network.

# The default /etc/nginx/conf.d/default.conf is empty in the base image, so
# this single file is the whole site config.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Console: static assets, SPA fallback to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: forward to the control plane service.
    # The control plane answers on :8080 (RUNSHIELD_HTTP_ADDR default).
    location /v1/ {
        proxy_pass http://controlplane:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Long-poll / batch upload timeouts for the agent's /v1/events/batch.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Immutable hashed assets (vite fingerprints them) cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # No directory listing, minimal logging to stdout.
    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
