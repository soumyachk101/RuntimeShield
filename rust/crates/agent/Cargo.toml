[package]
name = "runtime-shield-agent"
description = "RuntimeShield local security agent (CLI binary: runshield)"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "runshield"
path = "src/main.rs"

[dependencies]
runtime-shield-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
hex = "0.4"

[dev-dependencies]
tempfile = "3"
