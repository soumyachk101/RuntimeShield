[package]
name = "runtime-shield-agent"
description = "RuntimeShield local security agent (CLI binary: runshield)"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "runshield"
path = "src/main.rs"

[dependencies]
runtime-shield-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
