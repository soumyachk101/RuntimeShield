[package]
name = "runtime-shield-core"
description = "Deterministic policy engine for RuntimeShield: request validation, evaluation, path canonicalisation, network matching, secret redaction"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "runtime_shield_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
jsonschema = "0.60"
regex = "1"
hmac = "0.12"

[dev-dependencies]
tempfile = "3"
